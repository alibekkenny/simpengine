            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized (invalid credentials)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Romantic event/Romantic event step not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add option to event step
      tags:
      - romantic_event
  /romantic-event/{event_id}/steps/{step_id}/options/{id}:
    delete:
      consumes:
      - application/json
      description: Remove option of romantic event step. Only Romantic event owner,
