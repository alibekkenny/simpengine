          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Romantic event/Event step not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove event step
      tags:
      - romantic_event
    put:
      consumes:
      - application/json
      description: Updates event step of romantic event. Only Romantic event owner,
        can update step to it.
      parameters:
      - description: Romantic event id
        in: path
        name: event_id
        required: true
        type: integer
      - description: Event step id
        in: path
        name: id
        required: true
        type: integer
      - description: Event step data
        in: body
        name: eventStep
        required: true
        schema:
          $ref: '#/definitions/romanticevent.EventStepRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Invalid request (invalid ID, invalid body, or validation error)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized (invalid credentials)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Romantic event/Event Step not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update event step
      tags:
      - romantic_event
  /romantic-event/{event_id}/steps/{step_id}/options:
    post:
      consumes:
      - application/json
      description: Add option to romantic event step. Only Romantic event owner, can
