basePath: /
definitions:
  auth.LoginRequestDTO:
    properties:
      login:
        minLength: 3
        type: string
      password:
        minLength: 3
        type: string
    required:
    - login
    - password
    type: object
  auth.LoginResponseDTO:
    properties:
      token:
        type: string
    type: object
  media.UploadMediaResponseDTO:
    properties:
      id:
        type: integer
    type: object
  model.ErrorResponse:
    properties:
      code:
        example: INVALID_BODY
        type: string
      message:
        example: Invalid request
        type: string
    type: object
  model.EventStep:
    properties:
      description:
        type: string
      id:
        type: integer
      options:
        items:
          $ref: '#/definitions/model.EventStepOption'
        type: array
      step_order:
        type: integer
      title:
        type: string
    type: object
  model.EventStepOption:
    properties:
      id:
        type: integer
      img_id:
        type: string
      label:
        type: string
    type: object
  model.RomanticEvent:
    properties:
      description:
        type: string
      event_date:
        type: string
      id:
        type: integer
      public_token:
        type: string
      published_at:
        type: string
      simp_target_id:
        type: integer
      status:
        $ref: '#/definitions/model.RomanticEventStatus'
      title:
        type: string
    type: object
  model.RomanticEventStatus:
    enum:
    - draft
    - published
    - accepted
    - rejected
    - confirmed
    - archived
    type: string
    x-enum-varnames:
    - StatusDraft
    - StatusPublished
    - StatusAccepted
    - StatusRejected
    - StatusConfirmed
    - StatusArchived
  romanticevent.EventStepRequestDTO:
    properties:
      description:
        type: string
      step_order:
        type: integer
      title:
        minLength: 3
        type: string
    required:
    - description
    - step_order
    - title
    type: object
  romanticevent.EventStepResponseDTO:
    properties:
      description:
        type: string
      event_order:
        type: integer
      id:
        type: integer
      title:
        type: string
    type: object
  romanticevent.RomanticEventRequestDTO:
    properties:
      description:
        type: string
      event_date:
        type: string
      simp_target_id:
        type: integer
      title:
        minLength: 3
        type: string
    required:
    - description
    - event_date
    - simp_target_id
    - title
    type: object
  romanticevent.RomanticEventResponseDTO:
    properties:
      description:
        type: string
      event_date:
        type: string
      id:
        type: integer
      public_token:
        type: string
      published_at:
        type: string
      simp_target_id:
        type: integer
      steps:
        items:
          $ref: '#/definitions/model.EventStep'
        type: array
      title:
        type: string
    type: object
  romanticevent.StepOptionRequestDTO:
    properties:
      img_id:
        type: string
      label:
        minLength: 3
        type: string
    required:
    - img_id
    - label
    type: object
  romanticevent.StepOptionResponseDTO:
    properties:
      id:
        type: integer
      img_id:
        type: string
      label:
        type: string
    type: object
  simptarget.CreateSimpTargetResponseDTO:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  simptarget.SimpTarget:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  simptarget.SimpTargetRequestDTO:
    properties:
      description:
        type: string
      name:
        minLength: 2
        type: string
    required:
    - description
    - name
    type: object
  user.RegisterRequestDTO:
    properties:
      email:
        type: string
      login:
        minLength: 3
        type: string
      password:
        minLength: 3
        type: string
      token:
        description: optional (required only for admins)
        type: string
    required:
    - email
    - login
    - password
    type: object
  user.RegisterResponseDTO:
    properties:
      email:
        type: string
      id:
        type: integer
      login:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for managing romantic events in SimpEngine project
  title: SimpEngine API
  version: "1.0"
paths:
  /media:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a file to the media storage and returns its ID.
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/media.UploadMediaResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a media file
      tags:
      - Media
  /media/{id}:
    delete:
      description: Deletes the file by its id. Only media owner can delete it.
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No content
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: File not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletes media file
      tags:
      - media
    get:
      description: Returns the file as binary stream (with correct Content-Type and
        Content-Disposition headers).
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: File not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download media file
      tags:
      - media
  /romantic-event:
    get:
      description: Views a RomanticEvents of current User.
      produces:
      - application/json
      responses:
        "200":
          description: List of RomanticEvents
          schema:
            items:
              $ref: '#/definitions/model.RomanticEvent'
            type: array
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: View RomanticEvents by User
      tags:
      - romantic_event
    post:
      consumes:
      - application/json
      description: Creates romantic event by user
      parameters:
      - description: Romantic event data
        in: body
        name: romanticEvent
        required: true
        schema:
          $ref: '#/definitions/romanticevent.RomanticEventRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/romanticevent.RomanticEventResponseDTO'
        "400":
          description: Invalid request (invalid ID, invalid body, or validation error)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized (invalid credentials)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Simp target not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Creates romantic event
      tags:
      - romantic_event
    put:
      consumes:
      - application/json
      description: Updates an existing RomanticEvent by ID.
      parameters:
      - description: Romantic event data
        in: body
        name: romanticEvent
        required: true
        schema:
          $ref: '#/definitions/romanticevent.RomanticEventRequestDTO'
      - description: Romantic event id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request (invalid ID, invalid body, or validation error)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized (invalid credentials)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Simp target/Romantic event not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Cannot edit event with given status
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Updates romantic event
      tags:
      - romantic_event
  /romantic-event/{event_id}/steps:
    post:
      consumes:
      - application/json
      description: Add event step to romantic event. Only Romantic event owner, can
        add steps to it.
      parameters:
      - description: Romantic event id
        in: path
        name: event_id
        required: true
        type: integer
