      - application/json
      description: Update option of romantic event step. Only Romantic event owner,
        can update event step option.
      parameters:
      - description: Romantic event id
        in: path
        name: event_id
        required: true
        type: integer
      - description: Event step id
        in: path
        name: step_id
        required: true
        type: integer
      - description: Id
        in: path
        name: id
        required: true
        type: integer
      - description: Step option data
        in: body
        name: stepOption
        required: true
