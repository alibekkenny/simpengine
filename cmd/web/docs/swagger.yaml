        in: body
        name: eventStep
        required: true
        schema:
          $ref: '#/definitions/romanticevent.EventStepRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/romanticevent.EventStepResponseDTO'
        "400":
          description: Invalid request (invalid ID, invalid body, or validation error)
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
